<div id="tl-mobile-root" class="tl-root tl-is-mobile"></div>
<script>
  (function () {
    var v = '1.70.1';
    function go() {
      var rootEl = document.getElementById('tl-mobile-root');
      if (rootEl && window.Tuiles) window.Tuiles.boot(rootEl, { mobile: true, remember: true });
    }
    if (!document.getElementById('tl-css')) {
      var l = document.createElement('link');
      l.id = 'tl-css';
      l.rel = 'stylesheet';
      l.href = 'plugins/tuiles/desktop/css/tuiles.css?v=' + v;
      document.head.appendChild(l);
    }
    if (window.Tuiles) { go(); return; }
    var s = document.createElement('script');
    s.src = 'plugins/tuiles/desktop/js/tuiles.engine.js?v=' + v;
    s.onload = go;
    document.head.appendChild(s);
  })();
</script>
